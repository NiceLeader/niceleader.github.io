name: Deploy verified site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: production
      url: https://maciejlewandowski.dev
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and validate site
        run: npm run check

      - name: Run Lighthouse quality gates
        run: npm run lighthouse

      - name: Deploy verified site to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.122.0"
          command: pages deploy _site --project-name=maciejlewandowski-dev --branch=main --commit-hash=${{ github.sha }}
